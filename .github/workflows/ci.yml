name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install sibling libraries
      run: |
        python -m pip install --upgrade pip
        pip install "sudokulib @ git+https://github.com/reinarsson/sudokulib.git@main"
        pip install "authenticationlib @ git+https://github.com/reinarsson/authenticationlib.git@main"

    - name: Install dependencies
      run: |
        pip install fastapi uvicorn "pydantic[email]" pydantic-settings httpx dash dash-bootstrap-components
        pip install pytest pytest-asyncio coverage

    - name: Lint with flake8 (optional)
      run: |
        pip install flake8
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Run tests with coverage
      env:
        PYTHONPATH: src:tests
      run: |
        coverage run --source=src --omit="src/web/*" -m pytest tests/
        coverage report -m
        coverage xml

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
